<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ПРОМЕТРИКА · Демонстрация</title>
<style>
  :root { --bg:#0A0E14; --surface:#0E131B; --fg:#E8EDF4; --muted:#93A1B4;
          --accent:#2DD4A7; --on-accent:#06251C; --bad:#F87171;
          --border:rgba(255,255,255,.08); }
  * { box-sizing:border-box; margin:0; }
  body { min-height:100vh; display:grid; place-items:center; background:var(--bg);
         color:var(--fg); font:15px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif; }
  .card { width:min(380px, calc(100vw - 32px)); background:var(--surface);
          border:1px solid var(--border); border-radius:16px; padding:36px 32px;
          box-shadow:0 0 24px -4px rgba(45,212,167,.18), 0 16px 40px -16px rgba(0,0,0,.7); }
  .mark { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .dot { width:12px; height:12px; border-radius:3px; background:var(--accent);
         box-shadow:0 0 12px rgba(45,212,167,.8); }
  h1 { font-size:19px; letter-spacing:.08em; }
  p  { color:var(--muted); font-size:13.5px; margin:4px 0 24px; }
  label { display:block; font-size:12.5px; color:var(--muted); margin-bottom:6px; }
  input { width:100%; padding:11px 14px; border-radius:10px; border:1px solid var(--border);
          background:rgba(255,255,255,.04); color:var(--fg); font-size:16px;
          letter-spacing:.12em; outline:none; }
  input:focus { border-color:var(--accent); }
  button { width:100%; margin-top:14px; padding:12px; border:0; border-radius:10px;
           background:var(--accent); color:var(--on-accent); font-weight:700;
           font-size:15px; cursor:pointer; }
  button:hover { filter:brightness(1.08); }
  .err { display:none; color:var(--bad); font-size:13px; margin-top:12px; }
  .foot { margin-top:26px; font-size:12px; color:var(--muted); text-align:center; }
</style></head>
<body>
<form class="card" id="f">
  <div class="mark"><span class="dot"></span><h1>ПРОМЕТРИКА</h1></div>
  <p>Демонстрационный стенд мониторинга производства. Данные обезличены.</p>
  <label for="code">Код доступа</label>
  <input id="code" name="code" autocomplete="off" autofocus placeholder="••••••••">
  <button type="submit">Войти</button>
  <div class="err" id="err">Неверный код. Проверьте и попробуйте ещё раз.</div>
  <div class="foot">Код можно получить у представителя ПРОМЕТРИКИ</div>
</form>
<script>
  const SIG = "6e7fc1042f2e916537220ff9f4a4bdf86ca54d63f6b73b3d152bb5376d2b40b5"; // подставляется сборкой (sha256 кода доступа)
  const f = document.getElementById("f"), err = document.getElementById("err");
  async function sha256hex(s) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
    return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
  }
  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    const code = document.getElementById("code").value.trim();
    if (await sha256hex("prometrika:" + code) === SIG) {
      sessionStorage.setItem("pmk_demo_ok", SIG);
      location.href = "./app.html";
    } else {
      err.style.display = "block";
    }
  });
</script>
</body></html>
